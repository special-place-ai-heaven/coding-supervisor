[package]
name = "supervisor"
version = "0.18.1"
edition = "2024"

[dependencies]
supervisor-mcp = { path = "../adapters/mcp" }
supervisor-claude-code = { path = "../adapters/claude-code" }
serde_json = "1"
coding-supervisor = { path = ".." }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"

# The receipt signing key's Windows store: keyring's Windows Credential Manager backend, used
# directly (the `keyring` crate itself would add its Linux and macOS stores to Cargo.lock).
[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
