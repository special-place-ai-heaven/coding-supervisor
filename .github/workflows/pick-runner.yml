# Picks where Linux jobs run: one of the owner's self-hosted "fresh" runners
# when one is online and idle, otherwise GitHub-hosted ubuntu-latest.
# Pull requests always get ubuntu-latest so a fork's code never runs on a
# self-hosted machine. The lookup uses RUNNER_STATUS_TOKEN, else
# RELEASE_PLEASE_TOKEN (both org-wide secrets); it needs read access to the
# organisation's self-hosted runners. If neither token can read the list, the
# answer is ubuntu-latest.
# shortcut: idle is checked once at pick time; if another job takes the runner
# first, this job waits in the fresh queue until one frees up.
name: Pick runner

on:
  workflow_call:
    outputs:
      linux:
        description: JSON runs-on value for Linux jobs
        value: ${{ jobs.pick.outputs.linux }}

permissions:
  contents: read

jobs:
  pick:
    name: Pick the Linux runner
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
    steps:
      - id: pick
        env:
          # Org-wide secrets; the first one that can read the runner list wins.
          STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ORG: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          hosted='"ubuntu-latest"'
          fresh='["self-hosted","Linux","X64","fresh"]'
          choice="$hosted"
          filter='[.runners[] | select(.status == "online" and .busy == false and any(.labels[]; .name == "fresh"))] | length'
          if [ "$EVENT" = "pull_request" ]; then
            echo "pull request: always hosted"
          else
            for name in STATUS_TOKEN RELEASE_TOKEN; do
              token="${!name}"
              [ -n "$token" ] || { echo "$name: not set"; continue; }
              if counts=$(GH_TOKEN="$token" gh api "orgs/$ORG/actions/runners" --paginate --jq "$filter" 2>/dev/null); then
                idle=$(echo "$counts" | awk '{s += $1} END {print s + 0}')
                echo "$name: runner list read; idle fresh runners: $idle"
                [ "$idle" -gt 0 ] && choice="$fresh"
                break
              fi
              echo "$name: cannot read the organisation's runner list"
            done
          fi
          echo "linux=$choice" >> "$GITHUB_OUTPUT"
          echo "Linux jobs run on: $choice"
