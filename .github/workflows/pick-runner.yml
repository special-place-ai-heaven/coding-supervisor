# Picks where the Linux and Windows test jobs run.
#
# Route (SELF_HOSTED below, the only place the rule is written): a push, a release tag and a pull
# request from this repository run their tests on the owner's self-hosted runners; a fork's pull
# request, or a pull request labelled ci-hosted, runs GitHub-hosted, so a fork's code never
# executes on a self-hosted machine. This job itself always runs GitHub-hosted, so it never waits
# for the owner's PC (owner, 2026-11-09).
#
# On the self-hosted route:
# - Linux: a fresh heavy runner when one is online and idle, otherwise ubuntu-latest (owner,
#   2026-11-02: the fresh runners live on the owner's home PC, which is not always on).
# - Windows: the interim Windows runner when it is online, otherwise windows-latest.
# The lookup calls the GitHub API with curl and needs no JSON tool, so it also runs on a fresh
# runner, which has no gh or jq. It uses
# RUNNER_STATUS_TOKEN, else RELEASE_PLEASE_TOKEN (both org-wide secrets); it needs read access to
# the organisation's self-hosted runners. Every fallback to GitHub-hosted on the self-hosted route
# is a workflow warning, so it shows on the run's summary.
# shortcut: availability is checked once at pick time; if another job takes the runner first,
# this job waits in that runner's queue until it frees up.
name: Pick runner

on:
  workflow_call:
    outputs:
      linux:
        description: JSON runs-on value for Linux test jobs
        value: ${{ jobs.pick.outputs.linux }}
      windows:
        description: JSON runs-on value for Windows test jobs
        value: ${{ jobs.pick.outputs.windows }}

permissions:
  contents: read

jobs:
  pick:
    name: Pick the Linux runner
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      windows: ${{ steps.pick.outputs.windows }}
    steps:
      - id: pick
        env:
          # Org-wide secrets; the first one that can read the runner list wins.
          STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ORG: ${{ github.repository_owner }}
          SELF_HOSTED: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'ci-hosted')) }}
        run: |
          linux='"ubuntu-latest"'
          windows='"windows-latest"'
          heavy='["self-hosted","Linux","X64","fresh","heavy"]'
          interim='["self-hosted","Windows","X64","windows-host-interim"]'
          if [ "$SELF_HOSTED" != "true" ]; then
            echo "fork or ci-hosted pull request: GitHub-hosted by rule"
          else
            read_ok=false
            for name in STATUS_TOKEN RELEASE_TOKEN; do
              token="${!name}"
              [ -n "$token" ] || { echo "$name: not set"; continue; }
              # shortcut: one page of 100 runners; the total_count check below notices more.
              if ! json=$(curl -fsS --max-time 20 -H "Authorization: Bearer $token" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/orgs/$ORG/actions/runners?per_page=100"); then
                echo "$name: cannot read the organisation's runner list"
                continue
              fi
              read_ok=true
              # No JSON parser on the runner: one record per runner, starting at its "os" key,
              # which the API returns before status, busy and labels. A record count that differs
              # from total_count means that shape changed, and the answer stays hosted.
              flat=$(printf '%s' "$json" | tr -d '[:space:]')
              total=$(printf '%s' "$flat" | grep -o '"total_count":[0-9]*' | cut -d: -f2 || true)
              records=$(printf '%s' "$flat" | sed 's/"os":/\n/g' | tail -n +2)
              count=$(printf '%s\n' "$records" | grep -c . || true)
              if [ -z "$total" ] || [ "$count" != "$total" ]; then
                echo "::warning::runner list not understood ($count records, total_count ${total:-missing}); the tests run GitHub-hosted"
                break
              fi
              online=$(printf '%s\n' "$records" | grep '"status":"online"' || true)
              idle_heavy=$(printf '%s\n' "$online" | grep '"busy":false' | grep -c '"name":"heavy"' || true)
              online_windows=$(printf '%s\n' "$online" | grep -c '"name":"windows-host-interim"' || true)
              echo "$name: $total runners; idle heavy: $idle_heavy; online interim Windows: $online_windows"
              if [ "$idle_heavy" -gt 0 ]; then
                linux="$heavy"
              else
                echo "::warning::no idle fresh heavy runner; the Linux tests run GitHub-hosted"
              fi
              if [ "$online_windows" -gt 0 ]; then
                windows="$interim"
              else
                echo "::warning::the interim Windows runner is offline; the Windows tests run GitHub-hosted"
              fi
              break
            done
            if [ "$read_ok" = false ]; then
              echo "::warning::no token could read the runner list; the tests run GitHub-hosted"
            fi
          fi
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "Linux tests run on: $linux"
          echo "Windows tests run on: $windows"
