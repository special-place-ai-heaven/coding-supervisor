# Action versions chosen on 2026-10-29: actions/checkout@v7, Swatinem/rust-cache@v2,
# actions/upload-artifact@v7, actions/download-artifact@v8, softprops/action-gh-release@v3.
# The Rust toolchain is installed with rustup straight from rust-toolchain.toml.
#
# Tags are pushed by the owner only; the owner has set a tag ruleset on the
# repository, so nobody else can create a v* tag and trigger a release.
#
# Targets (owner's decision, 2026-10-29): Windows and Linux x86_64 only.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The fresh runners export RUSTC_WRAPPER=sccache without sccache installed;
  # an empty value turns the wrapper off.
  RUSTC_WRAPPER: ""

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Owner's rule (2026-10-29): Linux builds on the five self-hosted
          # runners labelled fresh; Windows on a GitHub-hosted runner (the
          # repository is public).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: [self-hosted, Linux, X64, fresh]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # A fresh Linux runner may have no rustup; the Windows runner is expected
      # to have it (and the MSVC build tools) already.
      - name: Install rustup if missing, then the pinned Rust toolchain
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true

      # The build is native, so the runner must already be the target.
      - name: Check the runner matches the target
        run: |
          rustc -vV
          rustc -vV | grep -x "host: ${{ matrix.target }}" > /dev/null

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Package binaries and checksum
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          name="coding-supervisor-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          for bin in supervisor supervisor-mcp supervisor-claude-code; do
            cp "target/release/${bin}${ext}" "dist/$name/"
          done
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="$name.zip"
            7z a "$archive" "$name" > /dev/null
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          rm -rf "$name"
          sha256sum "$archive" > "$archive.sha256"
          cat "$archive.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # The raw binaries, for the npm platform packages.
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: |
            target/release/supervisor
            target/release/supervisor-mcp
            target/release/supervisor-claude-code
            target/release/supervisor.exe
            target/release/supervisor-mcp.exe
            target/release/supervisor-claude-code.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: [self-hosted, Linux, X64, fresh]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Combine per-archive checksums into SHA256SUMS
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # A tag with a hyphen (v0.1.0-rc1) is a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # npm packaging follows symforge's build-npm-package and npm-publish jobs.
  npm-package:
    name: Build npm packages
    needs: build
    runs-on: [self-hosted, Linux, X64, fresh]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Synchronize npm package versions from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.TAG.replace(/^v/, '');
          const platformPackages = {
            'linux-x64': 'coding-supervisor-linux-x64',
            'windows-x64': 'coding-supervisor-windows-x64',
          };

          const rootPath = 'npm/package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.version = version;
          root.optionalDependencies = Object.fromEntries(
            Object.values(platformPackages).map((name) => [name, version]),
          );
          fs.writeFileSync(rootPath, JSON.stringify(root, null, 2) + '\n');

          for (const [dir, name] of Object.entries(platformPackages)) {
            const packagePath = `npm/platforms/${dir}/package.json`;
            const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
            pkg.name = name;
            pkg.version = version;
            fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          }
          NODE

      - name: Test npm package
        working-directory: npm
        run: npm test

      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist-binaries

      - name: Prepare platform npm packages
        shell: bash
        run: |
          set -euo pipefail
          copy_bins() {
            local from="$1" to="$2" ext="$3"
            mkdir -p "$to"
            for bin in supervisor supervisor-mcp supervisor-claude-code; do
              cp "$from/${bin}${ext}" "$to/${bin}${ext}"
              chmod 755 "$to/${bin}${ext}"
            done
          }
          copy_bins dist-binaries/bin-x86_64-pc-windows-msvc npm/platforms/windows-x64/bin .exe
          copy_bins dist-binaries/bin-x86_64-unknown-linux-gnu npm/platforms/linux-x64/bin ""
          for dir in npm npm/platforms/*; do
            cp LICENSE "$dir/LICENSE"
          done

      - name: Build npm tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-npm
          npm pack ./npm --pack-destination dist-npm
          for dir in npm/platforms/*; do
            npm pack "$dir" --pack-destination dist-npm
          done
          ls -l dist-npm

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist-npm/*.tgz
          if-no-files-found: error

  npm-publish:
    name: Publish npm packages
    needs: [npm-package, release]
    runs-on: [self-hosted, Linux, X64, fresh]
    steps:
      # A missing secret must fail here, visibly, rather than publish nothing.
      - name: Require the NPM_TOKEN secret
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::The NPM_TOKEN secret is not set for this repository; nothing was published to npm. Add it (organisation or repository secret) and push a new tag."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist

      # Pre-release tags (with a hyphen) go to the npm dist-tag "next", release tags to "latest".
      # Platform packages first, the wrapper last, so the wrapper never points at a missing version.
      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          case "$TAG" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          for package in \
            coding-supervisor-windows-x64 \
            coding-supervisor-linux-x64 \
            coding-supervisor
          do
            tarball="./dist/${package}-${version}.tgz"
            test -f "$tarball"
            if npm view "${package}@${version}" version > /dev/null 2>&1; then
              echo "${package}@${version} already exists on npm; skipping publish."
            else
              npm publish "$tarball" --access public --tag "$dist_tag"
            fi
          done
