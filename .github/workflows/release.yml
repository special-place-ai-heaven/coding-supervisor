# Action versions chosen on 2026-10-29: actions/checkout@v7, Swatinem/rust-cache@v2,
# actions/upload-artifact@v7, actions/download-artifact@v8, softprops/action-gh-release@v3.
# The Rust toolchain is installed with rustup straight from rust-toolchain.toml.
#
# The x86_64 macOS build runs on macos-15-intel, not macos-13: GitHub retired the
# macos-13 image in December 2025, and macos-latest is arm64 only.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # The build is native, so the runner must already be the target.
      - name: Check the runner matches the target
        run: |
          rustc -vV
          rustc -vV | grep -qx "host: ${{ matrix.target }}"

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Package binaries and checksum
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          name="coding-supervisor-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          for bin in supervisor supervisor-mcp supervisor-claude-code; do
            cp "target/release/${bin}${ext}" "dist/$name/"
          done
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="$name.zip"
            7z a "$archive" "$name" > /dev/null
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          rm -rf "$name"
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Combine per-archive checksums into SHA256SUMS
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
