# Action versions chosen on 2026-10-29: actions/checkout@v7, Swatinem/rust-cache@v2.
# The Rust toolchain is installed with rustup straight from rust-toolchain.toml,
# so that file is the only place the version is written.
#
# Runner policy (owner, 2026-11-02): temporarily GitHub-hosted runners only,
# while the owner's five self-hosted "fresh" runners (on the owner's home PC)
# are offline. Revert this commit to return pushes and Linux release jobs to
# the fresh pool. ubuntu-latest and windows-latest both run for pushes and
# pull requests; Windows because the first user and the adapter's path
# handling are Windows.
name: CI

on:
  push:
  pull_request:
  workflow_call:

# A new push cancels the superseded run of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No compiler wrapper; an empty value keeps any inherited one off.
  RUSTC_WRAPPER: ""

jobs:
  linux-hosted:
    name: "Linux (hosted): format, lint, test, core dependency check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # The autonomy fixtures spawn a real interpreter; Ubuntu images ship
      # python3 but usually no `python` launcher (Windows images have one).
      - name: Ensure python3 exists
        run: |
          command -v python3 || {
            sudo apt-get update && sudo apt-get install -y python3
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with warnings as errors
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Check the core crate has no dependencies
        run: |
          lines=$(cargo tree -p coding-supervisor --edges normal,build,dev | wc -l)
          if [ "$lines" -ne 1 ]; then
            echo "::error::coding-supervisor must have no dependencies, but cargo tree printed $lines lines:"
            cargo tree -p coding-supervisor --edges normal,build,dev
            exit 1
          fi

  windows-hosted:
    name: "Windows (hosted): format, lint, test"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with warnings as errors
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace
