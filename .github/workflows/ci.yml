# Action versions chosen on 2026-10-29: actions/checkout@v7, Swatinem/rust-cache@v2.
# The Rust toolchain is installed with rustup straight from rust-toolchain.toml,
# so that file is the only place the version is written.
#
# Runner policy (owner, 2026-11-02, extended 2026-11-09): for a push, a release tag and a pull
# request from this repository the Linux job runs on one of the owner's self-hosted fresh heavy
# runners when one is online and idle, and GitHub-hosted otherwise (the runners live on the
# owner's home PC, which is not always on). `changes`, the picker and the Windows job always run
# GitHub-hosted, so CI never waits for that PC. A fork's pull request, or one labelled ci-hosted,
# runs entirely GitHub-hosted, so a fork's code never executes on a self-hosted machine.
# pick-runner.yml holds the details; it needs the RUNNER_STATUS_TOKEN secret (or
# RELEASE_PLEASE_TOKEN) and picks hosted when neither can read the runner list. Job names never
# change with the runner, because they are required checks. Windows runs for every change because
# the first user and the adapter's path handling are Windows.
name: CI

# Runs once per change (owner, 2026-11-03: remove all waste): a push to main and a pull
# request, not a push to every branch or tag. The workflow itself always runs, so every pull
# request reports the same checks (a required check would otherwise wait forever on a PR that no
# workflow ran for); the `changes` job skips the heavy jobs, which then report as skipped, when a
# change touches documentation only (.github/docs-paths.txt, which the gate reads too) or is release-please's version-only pull request
# or its merge into main. The skill templates under skills/ are compiled into the binary, so they
# are not documentation. release.yml calls this workflow on each release tag, which always runs
# everything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A new push cancels the superseded run of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The fresh runners export RUSTC_WRAPPER=sccache without sccache installed;
  # an empty value turns the wrapper off.
  RUSTC_WRAPPER: ""

jobs:
  # Decides whether the heavy jobs run. They are skipped for release-please's version-only pull
  # request and its merge commit on main, and for a pull request or push to main that changes only
  # documentation. A release tag (release.yml) always runs everything.
  changes:
    name: Decide whether to run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF: ${{ github.ref }}
          MESSAGE: ${{ github.event.head_commit.message }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          run=true
          case "$HEAD_REF" in release-please--*) run=false ;; esac
          if [ "$REF" = "refs/heads/main" ] && printf '%s' "$MESSAGE" | head -n 1 | grep -q 'release-please--branches--'; then
            run=false
          fi
          # Which commits to compare; none (a tag, a new branch) means run everything.
          base= range=
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE range="$PR_BASE...$PR_HEAD"
          elif [ "$EVENT" = push ] && [ "$REF" = "refs/heads/main" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base=$BEFORE range="$BEFORE..$AFTER"
          fi
          if [ "$run" = true ] && [ -n "$range" ]; then
            # The documentation list is .github/docs-paths.txt, the same file the gate reads (one git
            # glob per line). It is read as it stands on the base commit, so a change cannot widen
            # the list to skip its own checks; a change to the list itself is not documentation.
            mapfile -t docs < <(git show "$base:.github/docs-paths.txt" 2>/dev/null \
              | sed -e 's/\r$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' -e '/^[#!\/]/d')
            # --no-renames lists both paths of a move, so moving a source file into docs/ still runs.
            if ! files=$(git diff --name-only --no-renames "$range"); then
              echo "::warning::could not list the changed files of $range; running everything"
            elif [ -n "$files" ] && [ "${#docs[@]}" -gt 0 ] \
                && ! code=$(git diff --name-only --no-renames "$range" -- . "${docs[@]/#/:(top,exclude,glob)}"); then
              echo "::warning::could not match the changed files against the documentation list; running everything"
            elif [ -n "$files" ] && [ "${#docs[@]}" -gt 0 ] && [ -z "$code" ]; then
              echo "documentation only:"
              printf '%s\n' "$files"
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run: $run"

  runner:
    # Name kept for required-check stability; it picks the Windows runner too.
    name: Pick the Linux runner
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  linux:
    name: "Linux: format, lint, test, core dependency check"
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v7

      # A fresh runner may have no rustup at all; install it with no default
      # toolchain, then let rustup read rust-toolchain.toml (1.99.1, rustfmt,
      # clippy). dtolnay/rust-toolchain cannot read that file.
      - name: Install rustup if missing, then the pinned Rust toolchain
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true

      # The autonomy fixtures spawn a real interpreter; Ubuntu images ship
      # python3 but usually no `python` launcher (Windows images have one).
      - name: Ensure python3 exists
        run: |
          command -v python3 || {
            sudo apt-get update && sudo apt-get install -y python3
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with warnings as errors
        run: cargo clippy --workspace --all-targets -- -D warnings

      # nextest runs every test in its own process, test files in parallel. Installed into
      # ~/.cargo/bin without sudo (the fresh runners have none), once per runner: a fixed version,
      # checked against its SHA-256. A copy already on the runner is used as it is.
      - name: Install cargo-nextest if missing
        run: |
          command -v cargo-nextest > /dev/null && exit 0
          version=0.9.151
          tgz="$RUNNER_TEMP/cargo-nextest.tgz"
          curl -LsSf --retry 3 -o "$tgz" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/cargo-nextest-$version-x86_64-unknown-linux-gnu.tar.gz"
          echo "1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4  $tgz" | sha256sum -c -
          tar zxf "$tgz" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-nextest

      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast

      - name: Check the core crate has no dependencies
        run: |
          lines=$(cargo tree -p coding-supervisor --edges normal,build,dev | wc -l)
          if [ "$lines" -ne 1 ]; then
            echo "::error::coding-supervisor must have no dependencies, but cargo tree printed $lines lines:"
            cargo tree -p coding-supervisor --edges normal,build,dev
            exit 1
          fi

      # WP6: Cargo.lock against the RustSec advisory database. Known vulnerabilities fail the job;
      # unmaintained, unsound and yanked notices only warn (cargo audit's defaults). The prebuilt
      # cargo-audit 0.22.2 archive is downloaded on every run into this job's own $RUNNER_TEMP,
      # its SHA-256 checked on every run, and the binary run from there, so no cached binary is
      # ever trusted. The advisory database it fetches is cached under the cargo home and stays
      # there on self-hosted runners; only the tool binary is fetched fresh.
      - name: Audit dependencies for known vulnerabilities
        run: |
          version=0.22.2
          name="cargo-audit-x86_64-unknown-linux-musl-v$version"
          dir="$RUNNER_TEMP/cargo-audit"
          rm -rf "$dir"
          mkdir -p "$dir"
          curl -LsSf --retry 3 -o "$dir/cargo-audit.tgz" "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv$version/$name.tgz"
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  $dir/cargo-audit.tgz" | sha256sum -c -
          tar zxf "$dir/cargo-audit.tgz" --strip-components=1 -C "$dir" "$name/cargo-audit"
          "$dir/cargo-audit" audit

  # WP7: every pull request, whatever its base, must add a receipt bundle under
  # supervisor-receipts/ that `supervisor receipt verify --bundle` accepts, and the bundled
  # contracts' acceptance commands are run again here, unless `supervisor receipt required` finds
  # an exemption (a head commit already on the default branch's tip, documentation only,
  # release-please's version-only pull request, or the receipt-exempt label applied by the owner
  # after the last push). The event's base is never
  # used: changing a pull request's base starts no new run, so a pull request is judged on
  # everything it would bring to the default branch. The key list, the docs list, the
  # release-please config and the diff base all come from the default branch's tip at run time
  # (origin/<default branch>; changed paths are merge-base(tip, head)...head), and the labels and
  # who applied them from the API, read before any pull request code is built. A push to the
  # default branch and a tag (release.yml's call carries its tag push) are a no-op success; any
  # other event fails this job, so a new trigger cannot pass unchecked.
  # Limit: on every pull request, a fork's included, this workflow file and the verifier binary
  # both come from the pull request itself; the protection rests on review plus the key list read
  # from the default branch. After the owner applies the label, re-run this job: label events do
  # not start CI, and a later push needs the label removed and applied again. GitHub-hosted on
  # purpose: a fork's pull request must never run on a self-hosted machine, the job runs for
  # docs-only changes too (the picker is skipped then), and it needs gh and jq, which the fresh
  # runners lack. Re-running the acceptance commands repeats part of the test job; it is kept to
  # the bundled contracts' own commands.
  receipts:
    name: Verify supervisor receipts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # The label timeline: GET /repos/.../issues/<n>/timeline.
      pull-requests: read
      issues: read
    steps:
      - name: Decide what this event needs
        id: event
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "pr=true" >> "$GITHUB_OUTPUT"
            echo "A pull request: its receipt is checked."
          elif [ "$EVENT" = push ] && [ -n "$DEFAULT" ] && [ "$REF" = "refs/heads/$DEFAULT" ]; then
            echo "No receipt is required for a push to $REF."
          elif [ "$EVENT" = push ] && [ "${REF#refs/tags/}" != "$REF" ]; then
            echo "No receipt is required for the tag $REF."
          else
            echo "::error::a $EVENT event ($REF) is not one this job knows; it fails rather than pass unchecked"
            exit 1
          fi

      # The only step with a token, run before any pull request code is built or run. The file it
      # writes stays writable by the later build of pull request code; that is inside the stated
      # limit that the verifier itself comes from the pull request.
      - name: Read the label timeline from the API
        if: steps.event.outputs.pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          gh api --paginate "repos/$REPO/issues/$PR/timeline" --jq '.[] | @json' > "$RUNNER_TEMP/receipts/timeline.jsonl"

      # The pull request's own head commit, not the merge commit: a bundle names the tree of the
      # commit it was made for. fetch-depth 0 also fetches every branch; no credentials are left
      # in .git/config.
      - uses: actions/checkout@v7
        if: steps.event.outputs.pr == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        if: steps.event.outputs.pr == 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: steps.event.outputs.pr == 'true'
        continue-on-error: true

      - name: Build the verifier from this pull request
        if: steps.event.outputs.pr == 'true'
        run: |
          cargo build --locked -p supervisor
          cp target/debug/supervisor "$RUNNER_TEMP/receipts/supervisor"

      - name: Decide whether a receipt is required, then verify every bundle this pull request adds
        id: verify
        if: steps.event.outputs.pr == 'true'
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          # The repository belongs to an organisation, which never applies a label, so the
          # owner's own login decides the label and is release-please's author (its token is
          # the owner's).
          OWNER_LOGIN: special-place-administrator
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/receipts"
          bin="$dir/supervisor"
          if [ "$(git rev-parse HEAD)" != "$HEAD" ]; then
            echo "::error::the checkout is not the pull request's head commit $HEAD"
            exit 1
          fi
          # The default branch's tip, fetched again explicitly; without it nothing is judged.
          git fetch --no-tags --quiet origin "+refs/heads/$DEFAULT:refs/remotes/origin/$DEFAULT"
          if ! tip=$(git rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT^{commit}"); then
            echo "::error::the default branch $DEFAULT could not be resolved"
            exit 1
          fi
          fork=$(git merge-base "$tip" "$HEAD") || { echo "::error::this pull request shares no history with $DEFAULT, so there is no point to compare from"; exit 1; }
          echo "default branch $DEFAULT at $tip; this pull request leaves it at $fork"
          # A head already on the tip (CI ran after the merge) brings nothing. Only exit 0 counts;
          # exit 1 or any error leaves the flag out.
          merged=()
          if git merge-base --is-ancestor "$HEAD" "$tip"; then
            merged=(--head-on-default-branch)
          fi
          # Lists from the default branch, so a pull request cannot widen them for itself.
          git show "$tip:.github/docs-paths.txt" > "$dir/docs-paths.txt" 2>/dev/null || : > "$dir/docs-paths.txt"
          git show "$tip:.github/release-please-config.json" > "$dir/release-please-config.json" 2>/dev/null || echo '{}' > "$dir/release-please-config.json"
          git diff --name-only --no-renames "$fork" "$HEAD" > "$dir/changed.txt"
          "$bin" receipt required --event "$GITHUB_EVENT_PATH" --labels "$dir/timeline.jsonl" \
            --changed "$dir/changed.txt" --docs-paths "$dir/docs-paths.txt" \
            --release-config "$dir/release-please-config.json" --owner "$OWNER_LOGIN" \
            "${merged[@]}" > "$dir/required.json"
          cat "$dir/required.json"
          if [ "$(jq -r .required "$dir/required.json")" != true ]; then
            echo "No receipt required: $(jq -r .reason "$dir/required.json")"
            exit 0
          fi
          if ! git show "$tip:supervisor-keys.json" > "$dir/keys.json" 2>/dev/null; then
            echo "::error::the default branch has no supervisor-keys.json, so no receipt signature can be trusted"
            exit 1
          fi
          # Only bundles this pull request adds or changes count; the folder accumulates on main.
          mapfile -t bundles < <(git diff --name-only --no-renames --diff-filter=AM "$fork" "$HEAD" -- supervisor-receipts/)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "::error::this pull request adds no receipt bundle under supervisor-receipts/ and no exemption applies; run 'supervisor receipt export' on the completed task and commit the bundle, or ask the owner for the receipt-exempt label"
            exit 1
          fi
          : > "$dir/commands.jsonl"
          for bundle in "${bundles[@]}"; do
            echo "verifying $bundle"
            "$bin" receipt verify --bundle "$bundle" --keys "$dir/keys.json" --project . --base "$fork" | tee "$dir/verify.json"
            jq -c '.acceptance[].command' "$dir/verify.json" >> "$dir/commands.jsonl"
          done
          echo "rerun=true" >> "$GITHUB_OUTPUT"

      # A bundled contract can name `cargo nextest run`. Downloaded only when commands are re-run,
      # so a pull request that needs no receipt does not depend on the download; a fixed version,
      # checked against its SHA-256, and only the one binary is taken from the archive.
      - name: Install cargo-nextest if missing
        if: steps.event.outputs.pr == 'true' && steps.verify.outputs.rerun == 'true'
        run: |
          command -v cargo-nextest > /dev/null && exit 0
          version=0.9.151
          tgz="$RUNNER_TEMP/cargo-nextest.tgz"
          curl -LsSf --retry 3 -o "$tgz" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/cargo-nextest-$version-x86_64-unknown-linux-gnu.tar.gz"
          echo "1d4ce302b820c41f4b89c5fb9bce45f0f0c94882c1cf08fc360caf08be6e7df4  $tgz" | sha256sum -c -
          tar zxf "$tgz" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-nextest

      # No token or secret is in this step's environment: the step names none, and env -i drops
      # the runner's own variables. Hosted runners allow sudo, so a command could still reach the
      # job's token through the runner; that is why the job's permissions are read-only. Commands
      # run unchanged with bash on Linux; one recorded with Windows-only syntax fails the job, it
      # is never skipped.
      - name: Re-run the bundled contracts' acceptance commands
        if: steps.event.outputs.pr == 'true' && steps.verify.outputs.rerun == 'true'
        run: |
          set -euo pipefail
          sort -u "$RUNNER_TEMP/receipts/commands.jsonl" > "$RUNNER_TEMP/receipts/unique.jsonl"
          while IFS= read -r line; do
            command=$(jq -r . <<< "$line")
            echo "::group::$command"
            env -i PATH="$PATH" HOME="$HOME" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
              RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_TERM_COLOR=always RUSTC_WRAPPER= \
              timeout 1800 bash -c "$command" < /dev/null
            echo "::endgroup::"
          done < "$RUNNER_TEMP/receipts/unique.jsonl"

  # Formatting, lint and the dependency check are the same on both systems and run on Linux.
  windows-hosted:
    # GitHub-hosted (owner, 2026-11-09): the shared interim Windows runner was too loaded for the
    # timing tests. Job name kept for required-check stability.
    name: "Windows (hosted): test"
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast
