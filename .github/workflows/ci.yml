# Action versions chosen on 2026-10-29: actions/checkout@v7, Swatinem/rust-cache@v2.
# The Rust toolchain is installed with rustup straight from rust-toolchain.toml,
# so that file is the only place the version is written.
#
# Runner policy (owner, 2026-11-02): Linux jobs use the owner's self-hosted
# "fresh" runners when one is online and idle, and GitHub-hosted ubuntu-latest
# otherwise (the fresh runners live on the owner's home PC, which is not always
# on). The runner job below decides; it needs the RUNNER_STATUS_TOKEN secret
# (or RELEASE_PLEASE_TOKEN; read access to the organisation's self-hosted runners) and picks hosted
# when that secret is absent or the lookup fails. Pull requests always run
# hosted, so a fork's code never executes on a self-hosted machine. A hosted
# windows-latest job runs for both, because the first user and the adapter's
# path handling are Windows.
name: CI

# Runs once per change (owner, 2026-11-03: remove all waste): a push to main and a pull
# request, not a push to every branch or tag. The workflow itself always runs, so every pull
# request reports the same checks (a required check would otherwise wait forever on a PR that no
# workflow ran for); the `changes` job skips the heavy jobs, which then report as skipped, when a
# change touches documentation only (`DOCS` below) or is release-please's version-only pull request
# or its merge into main. The skill templates under skills/ are compiled into the binary, so they
# are not documentation. release.yml calls this workflow on each release tag, which always runs
# everything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A new push cancels the superseded run of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The fresh runners export RUSTC_WRAPPER=sccache without sccache installed;
  # an empty value turns the wrapper off.
  RUSTC_WRAPPER: ""

jobs:
  # Decides whether the heavy jobs run. They are skipped for release-please's version-only pull
  # request and its merge commit on main, and for a pull request or push to main that changes only
  # documentation. A release tag (release.yml) always runs everything.
  changes:
    name: Decide whether to run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF: ${{ github.ref }}
          MESSAGE: ${{ github.event.head_commit.message }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          # Root-level files and the docs folder; the same list ci.yml once had under paths-ignore.
          DOCS: '^(docs/.*|README\.md|CHANGELOG\.md|CLAUDE\.md|HANDOVER\.md|LICENSE)$'
        run: |
          run=true
          case "$HEAD_REF" in release-please--*) run=false ;; esac
          if [ "$REF" = "refs/heads/main" ] && printf '%s' "$MESSAGE" | head -n 1 | grep -q 'release-please--branches--'; then
            run=false
          fi
          # Which commits to compare; none (a tag, a new branch) means run everything.
          range=
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...$PR_HEAD"
          elif [ "$EVENT" = push ] && [ "$REF" = "refs/heads/main" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE..$AFTER"
          fi
          if [ "$run" = true ] && [ -n "$range" ]; then
            if ! files=$(git diff --name-only "$range"); then
              echo "::warning::could not list the changed files of $range; running everything"
            elif [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Evq "$DOCS"; then
              echo "documentation only:"
              printf '%s\n' "$files"
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run: $run"

  runner:
    name: Pick the Linux runner
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit

  linux:
    name: "Linux: format, lint, test, core dependency check"
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v7

      # A fresh runner may have no rustup at all; install it with no default
      # toolchain, then let rustup read rust-toolchain.toml (1.99.1, rustfmt,
      # clippy). dtolnay/rust-toolchain cannot read that file.
      - name: Install rustup if missing, then the pinned Rust toolchain
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true

      # The autonomy fixtures spawn a real interpreter; Ubuntu images ship
      # python3 but usually no `python` launcher (Windows images have one).
      - name: Ensure python3 exists
        run: |
          command -v python3 || {
            sudo apt-get update && sudo apt-get install -y python3
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with warnings as errors
        run: cargo clippy --workspace --all-targets -- -D warnings

      # nextest runs every test in its own process, test files in parallel. Installed into
      # ~/.cargo/bin without sudo (the fresh runners have none), once per runner.
      - name: Install cargo-nextest if missing
        run: |
          command -v cargo-nextest > /dev/null || curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast

      - name: Check the core crate has no dependencies
        run: |
          lines=$(cargo tree -p coding-supervisor --edges normal,build,dev | wc -l)
          if [ "$lines" -ne 1 ]; then
            echo "::error::coding-supervisor must have no dependencies, but cargo tree printed $lines lines:"
            cargo tree -p coding-supervisor --edges normal,build,dev
            exit 1
          fi

  # Formatting, lint and the dependency check are the same on both systems and run on Linux.
  windows-hosted:
    name: "Windows (hosted): test"
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace --no-fail-fast
